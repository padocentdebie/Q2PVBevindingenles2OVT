<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politie Academie | Leaderboard Training</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --police-blue: #003366; }
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .police-card { border-top: 8px solid var(--police-blue); }
        .logo-img { height: 55px; width: auto; object-fit: contain; }
        textarea { resize: none; }
    </style>
</head>
<body class="flex flex-col items-center justify-center min-h-screen p-4 gap-6">

    <div id="login-screen" class="max-w-md w-full bg-white shadow-2xl rounded-xl p-8 police-card">
        <h2 class="text-2xl font-black text-[#003366] mb-4 uppercase italic">Aanmelden Training</h2>
        <input type="text" id="studentName" placeholder="Naam" class="w-full p-3 border-2 mb-3 rounded-lg">
        <select id="studentClass" class="w-full p-3 border-2 mb-6 rounded-lg">
            <option value="">Kies je klas...</option>
            <option value="Klas A">Klas A</option>
            <option value="Klas B">Klas B</option>
            <option value="Klas C">Klas C</option>
        </select>
        <button onclick="startTraining()" class="w-full bg-[#003366] text-white py-4 rounded-lg font-black uppercase tracking-widest">Start Sessie</button>
    </div>

    <div id="main-container" class="hidden max-w-5xl w-full grid grid-cols-1 md:grid-cols-3 gap-6">
        
        <div class="md:col-span-2 bg-white shadow-2xl rounded-xl overflow-hidden police-card">
            <div class="bg-[#003366] p-6 text-white flex justify-between items-center">
                <div class="flex items-center gap-4">
                    <div>
                        <h1 class="text-xl font-black italic uppercase leading-none tracking-tighter">PV-Training</h1>
                        <p id="user-display" class="text-[10px] uppercase tracking-widest text-blue-200 font-bold mt-1"></p>
                    </div>
                </div>
                <div class="text-right">
                    <span id="counter" class="text-2xl font-black text-yellow-400">1 / 25</span>
                </div>
            </div>

            <div class="p-8">
                <div id="exercise-box">
                    <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Passieve constructie:</p>
                    <div id="passive-sentence" class="text-lg font-bold text-slate-700 italic border-l-4 border-slate-200 pl-4 py-2 bg-slate-50 mb-6">Laden...</div>
                    
                    <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Uw actieve PV-tekst:</p>
                    <textarea id="userInput" rows="3" class="w-full p-4 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-900 text-lg mb-4" placeholder="Ik zag dat..."></textarea>
                    
                    <div id="feedback" class="hidden mb-6 p-4 rounded-lg text-sm font-bold border-l-4"></div>
                    <button onclick="checkAnswer()" class="w-full bg-[#003366] text-white py-4 rounded-lg font-black uppercase tracking-widest">Vastleggen</button>
                </div>

                <div id="final-screen" class="hidden text-center py-10">
                    <h2 class="text-3xl font-black text-blue-900 mb-2">DOSSIER VOLTOOID</h2>
                    <button onclick="location.reload()" class="bg-[#003366] text-white px-8 py-3 rounded-lg font-bold uppercase">Opnieuw</button>
                </div>
            </div>
        </div>

        <div class="bg-white shadow-xl rounded-xl p-6 border-t-8 border-yellow-500">
            <h2 class="text-xl font-black text-[#003366] mb-4 uppercase italic">Leaderboard <span id="board-class"></span></h2>
            <div id="leaderboard-list" class="space-y-3">
                <p class="text-sm text-slate-500 italic">Score wordt geladen...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, update, increment } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3_rzoZOWytlyAbYKKe_WuFlD8z2WvbX4",
            authDomain: "aangifteq2les1.firebaseapp.com",
            databaseURL: "https://aangifteq2les1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "aangifteq2les1",
            storageBucket: "aangifteq2les1.firebasestorage.app",
            messagingSenderId: "1071661084879",
            appId: "1:1071661084879:web:ec81dfed806ad75a8847ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        let currentUser = { name: "", klas: "", score: 0 };
        let currentIdx = 0;

        const questions = [
            { p: "Door mij werd gezien dat de auto wegreed.", v: "zag" },
            { p: "Door mij is geroken dat de man naar alcohol stonk.", v: "rook" },
            { p: "Door mij was gehoord dat er werd geschreeuwd.", v: "hoorde" },
            { p: "Door mij zijn braaksporen waargenomen.", v: "nam" },
            { p: "Door mij wordt gezien dat hij een wapen trekt.", v: "zag" }
            // Voeg hier de rest van je 25 zinnen toe...
        ];

        window.startTraining = function() {
            const name = document.getElementById('studentName').value.trim();
            const klas = document.getElementById('studentClass').value;
            
            if(!name || !klas) return alert("Vul je naam en klas in!");
            
            currentUser = { name, klas, score: 0 };
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = `${name} | ${klas}`;
            document.getElementById('board-class').innerText = klas;
            
            loadLeaderboard(klas);
            showQuestion();
        };

        function showQuestion() {
            if(currentIdx < questions.length) {
                document.getElementById('passive-sentence').innerText = questions[currentIdx].p;
                document.getElementById('counter').innerText = `${currentIdx + 1} / ${questions.length}`;
                document.getElementById('userInput').value = "";
                document.getElementById('feedback').classList.add('hidden');
            } else {
                document.getElementById('exercise-box').classList.add('hidden');
                document.getElementById('final-screen').classList.remove('hidden');
            }
        }

        window.checkAnswer = function() {
            const input = document.getElementById('userInput').value.toLowerCase();
            const q = questions[currentIdx];
            const feedback = document.getElementById('feedback');

            if(input.startsWith("ik") && input.includes(" dat ") && input.includes(q.v)) {
                currentUser.score += 10;
                updateScore();
                feedback.innerText = "+10 Punten! Goede actieve waarneming.";
                feedback.className = "mb-6 p-4 rounded-lg text-sm font-bold bg-green-100 text-green-800 border-l-4 border-green-500";
                feedback.classList.remove('hidden');
                currentIdx++;
                setTimeout(showQuestion, 1000);
            } else {
                feedback.innerText = `FOUT. Gebruik 'Ik ${q.v} dat...'`;
                feedback.className = "mb-6 p-4 rounded-lg text-sm font-bold bg-red-100 text-red-800 border-l-4 border-red-500";
                feedback.classList.remove('hidden');
            }
        };

        function updateScore() {
            const userRef = ref(db, `leaderboard/${currentUser.klas}/${currentUser.name}`);
            set(userRef, { score: currentUser.score });
        }

        function loadLeaderboard(klas) {
            const boardRef = ref(db, `leaderboard/${klas}`);
            onValue(boardRef, (snapshot) => {
                const data = snapshot.val();
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = "";
                
                if(data) {
                    const sorted = Object.entries(data)
                        .sort(([,a], [,b]) => b.score - a.score)
                        .slice(0, 5);
                        
                    sorted.forEach(([name, val], index) => {
                        list.innerHTML += `
                            <div class="flex justify-between items-center p-2 ${name === currentUser.name ? 'bg-yellow-100 rounded border-l-4 border-yellow-500' : 'border-b'}">
                                <span class="font-bold">${index + 1}. ${name}</span>
                                <span class="text-[#003366] font-black">${val.score}</span>
                            </div>`;
                    });
                }
            });
        }
    </script>
</body>
</html>
