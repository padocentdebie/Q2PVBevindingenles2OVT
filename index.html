<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politie Academie | Leaderboard & Digibord</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --police-blue: #003366; }
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .police-card { border-top: 8px solid var(--police-blue); }
        textarea { resize: none; }
        #canvas-container { position: relative; background: #fff; border: 2px solid #003366; border-radius: 8px; cursor: crosshair; }
        canvas { display: block; touch-action: none; }
    </style>
</head>
<body class="flex flex-col items-center p-4 gap-6">

    <div id="login-screen" class="max-w-md w-full bg-white shadow-2xl rounded-xl p-8 police-card mt-10">
        <h2 class="text-2xl font-black text-[#003366] mb-2 uppercase italic text-center">Aanmelden Academie</h2>
        <div class="bg-blue-50 border-l-4 border-blue-500 p-4 mb-6 text-xs">
            <strong>Instructie:</strong> Schrijf waarnemingen <strong>actief</strong> , <strong>objectief</strong> en <strong>filmisch</strong>(OVT).
        </div>
        <input type="text" id="studentName" placeholder="Naam" class="w-full p-3 border-2 mb-3 rounded-lg">
        <select id="studentClass" class="w-full p-3 border-2 mb-6 rounded-lg">
            <option value="">Kies je klas...</option>
            <option value="Klas Alpha">Klas Alpha</option><option value="Klas Bravo">Klas Bravo</option>
            <option value="Klas Charlie">Klas Charlie</option><option value="Klas Delta">Klas Delta</option>
            <option value="Klas Echo">Klas Echo</option><option value="Klas Foxtrot">Klas Foxtrot</option>
            <option value="Klas Golf">Klas Golf</option><option value="Klas Juliett">Klas Juliett</option>
            <option value="Klas Lima">Klas Lima</option><option value="Klas Mike">Klas Mike</option>
        </select>
        <button onclick="startTraining()" class="w-full bg-[#003366] text-white py-4 rounded-lg font-black uppercase tracking-widest">Start Sessie</button>
    </div>

    <div id="main-container" class="hidden max-w-7xl w-full grid grid-cols-1 lg:grid-cols-4 gap-6">
        
        <div class="lg:col-span-3 space-y-4">
            <div class="bg-white shadow-2xl rounded-xl p-4 police-card">
                <div class="flex justify-between items-center mb-2">
                    <h3 class="font-black text-[#003366] uppercase italic italic">Interactief Digibord</h3>
                    <input type="text" id="boardInput" placeholder="Typ een zin en druk op Enter..." class="flex-1 mx-4 p-2 border-2 rounded-lg text-sm outline-none focus:border-blue-900">
                    <button onclick="clearBoard()" class="bg-red-600 text-white px-3 py-1 rounded text-xs font-bold uppercase">Wis Bord</button>
                </div>
                <div id="canvas-container">
                    <canvas id="digiBoard" width="800" height="450"></canvas>
                </div>
            </div>

            <div class="bg-white shadow-2xl rounded-xl overflow-hidden police-card">
                <div class="bg-[#003366] p-4 text-white flex justify-between">
                    <span id="user-display" class="text-xs font-bold uppercase"></span>
                    <span id="counter" class="font-black text-yellow-400 italic">1 / 25</span>
                </div>
                <div class="p-6">
                    <div id="exercise-box">
                        <p class="text-[10px] font-black text-slate-400 mb-1">FOUTIEVE PASSIEVE VORM:</p>
                        <div id="passive-sentence" class="text-md font-bold text-slate-700 italic border-l-4 border-slate-200 pl-4 py-2 bg-slate-50 mb-4">Laden...</div>
                        <textarea id="userInput" rows="2" class="w-full p-3 border-2 rounded-lg mb-4 text-lg" placeholder="Ik zag dat..."></textarea>
                        <div id="feedback" class="hidden mb-4 p-3 rounded text-sm font-bold border-l-4"></div>
                        <button onclick="checkAnswer()" class="w-full bg-[#003366] text-white py-3 rounded-lg font-black uppercase tracking-widest">Vastleggen</button>
                    </div>
                </div>
            </div>
        </div>

        <div class="bg-white shadow-xl rounded-xl p-4 border-t-8 border-yellow-500 h-fit">
            <h2 class="font-black text-[#003366] mb-4 uppercase italic">Leaderboard <span id="board-class" class="text-yellow-600"></span></h2>
            <div id="leaderboard-list" class="space-y-2 text-sm italic text-slate-500">Score wordt geladen...</div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA3_rzoZOWytlyAbYKKe_WuFlD8z2WvbX4",
            authDomain: "aangifteq2les1.firebaseapp.com",
            databaseURL: "https://aangifteq2les1-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "aangifteq2les1",
            storageBucket: "aangifteq2les1.firebasestorage.app",
            messagingSenderId: "1071661084879",
            appId: "1:1071661084879:web:ec81dfed806ad75a8847ba"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const canvas = document.getElementById('digiBoard');
        const ctx = canvas.getContext('2d');
        let currentUser = { name: "", klas: "", score: 0 };
        let drawing = false;

        // --- DIGIBORD LOGICA ---
        const boardInput = document.getElementById('boardInput');
        boardInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && boardInput.value.trim() !== "") {
                const textRef = ref(db, `digibord/${currentUser.klas}/texts`);
                push(textRef, { content: boardInput.value, x: 50, y: 50 + (Math.random() * 200) });
                boardInput.value = "";
            }
        });

        canvas.addEventListener('mousedown', startDrawing);
        canvas.addEventListener('mousemove', draw);
        canvas.addEventListener('mouseup', stopDrawing);

        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            return { x: e.clientX - rect.left, y: e.clientY - rect.top };
        }

        function startDrawing(e) {
            drawing = true;
            const pos = getPos(e);
            const lineRef = push(ref(db, `digibord/${currentUser.klas}/lines`));
            currentUser.currentLineId = lineRef.key;
            set(lineRef, { points: [pos], color: '#003366' });
        }

        function draw(e) {
            if (!drawing) return;
            const pos = getPos(e);
            const lineRef = ref(db, `digibord/${currentUser.klas}/lines/${currentUser.currentLineId}/points`);
            // We halen de huidige punten niet op (traag), maar voegen toe aan de array via Firebase (simpelere versie voor demo)
            // In productie zou je dit bufferen, hier doen we een push naar de array-structuur
            onValue(lineRef, (snap) => {
                let pts = snap.val() || [];
                pts.push(pos);
                set(lineRef, pts);
            }, { onlyOnce: true });
        }

        function stopDrawing() { drawing = false; }

        window.clearBoard = () => remove(ref(db, `digibord/${currentUser.klas}`));

        // Luisteren naar wijzigingen op het bord
        function syncBoard(klas) {
            onValue(ref(db, `digibord/${klas}`), (snapshot) => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                const data = snapshot.val();
                if (!data) return;

                // Teken lijnen
                if (data.lines) {
                    Object.values(data.lines).forEach(line => {
                        ctx.beginPath();
                        ctx.strokeStyle = line.color;
                        ctx.lineWidth = 2;
                        line.points.forEach((p, i) => {
                            if (i === 0) ctx.moveTo(p.x, p.y);
                            else ctx.lineTo(p.x, p.y);
                        });
                        ctx.stroke();
                    });
                }
                // Teken teksten
                if (data.texts) {
                    ctx.font = "bold 18px Segoe UI";
                    ctx.fillStyle = "#003366";
                    Object.values(data.texts).forEach(t => ctx.fillText(t.content, t.x, t.y));
                }
            });
        }

        // --- STANDAARD TRAINING LOGICA (Zinnen, Leaderboard etc.) ---
        const questions = [
            { p: "Door mij werd gezien dat de auto wegreed.", v: "zag" },
            { p: "Door mij is geroken dat de man naar alcohol stonk.", v: "rook" },
            { p: "Door mij was gehoord dat er werd geschreeuwd.", v: "hoorde" },
            { p: "Door mij zijn braaksporen waargenomen.", v: "nam" },
            { p: "Door mij wordt gezien dat hij een wapen trekt.", v: "zag" },
            { p: "Door mij werd gezien dat een wond op het been van het slachtoffer bloedde.", v: "zag" }
            // ... overige zinnen
        ];

        let currentIdx = 0;
        window.startTraining = () => {
            const name = document.getElementById('studentName').value.trim();
            const klas = document.getElementById('studentClass').value;
            if(!name || !klas) return alert("Naam en klas verplicht!");
            currentUser = { ...currentUser, name, klas };
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('main-container').classList.remove('hidden');
            document.getElementById('user-display').innerText = `${name} | ${klas}`;
            document.getElementById('board-class').innerText = klas;
            syncBoard(klas);
            loadLeaderboard(klas);
            showQuestion();
        };

        function showQuestion() {
            if(currentIdx < questions.length) {
                document.getElementById('passive-sentence').innerText = questions[currentIdx].p;
                document.getElementById('counter').innerText = `${currentIdx + 1} / ${questions.length}`;
                document.getElementById('userInput').value = "";
                document.getElementById('feedback').classList.add('hidden');
            }
        }

        window.checkAnswer = function() {
            const input = document.getElementById('userInput').value.toLowerCase().trim();
            const q = questions[currentIdx];
            const fb = document.getElementById('feedback');
            
            if (["zie", "hoor", "ruik"].some(tt => input.includes("ik " + tt))) {
                fb.innerText = "GEBRUIK DE OVT (Verleden tijd) voor filmisch effect!";
                fb.className = "mb-4 p-3 rounded bg-orange-100 text-orange-800 border-l-4 border-orange-500 block";
                return;
            }

            if(input.startsWith("ik") && input.includes(q.v)) {
                currentUser.score += 10;
                set(ref(db, `leaderboard/${currentUser.klas}/${currentUser.name}`), { score: currentUser.score });
                fb.innerText = "+10 Punten! Filmisch en actief.";
                fb.className = "mb-4 p-3 rounded bg-green-100 text-green-800 border-l-4 border-green-500 block";
                currentIdx++;
                setTimeout(showQuestion, 1000);
            } else {
                fb.innerText = `FOUT: Gebruik 'Ik ${q.v} dat...'`;
                fb.className = "mb-4 p-3 rounded bg-red-100 text-red-800 border-l-4 border-red-500 block";
            }
        };

        function loadLeaderboard(klas) {
            onValue(ref(db, `leaderboard/${klas}`), (snap) => {
                const list = document.getElementById('leaderboard-list');
                list.innerHTML = "";
                const data = snap.val();
                if(data) {
                    Object.entries(data).sort(([,a],[,b]) => b.score - a.score).forEach(([n, v], i) => {
                        list.innerHTML += `<div class="flex justify-between p-2 border-b"><b>${i+1}. ${n}</b> <span>${v.score}</span></div>`;
                    });
                }
            });
        }
    </script>
</body>
</html>
