<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politie Academie | Actief Schrijven Trainer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --police-blue: #003366; }
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .police-card { border-top: 8px solid var(--police-blue); }
        .logo-img { height: 50px; width: auto; object-fit: contain; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-2xl w-full bg-white shadow-2xl rounded-xl overflow-hidden police-card">
        <div class="bg-[#003366] p-6 text-white flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="200w.gif">
                <div>
                    <h1 class="text-xl font-black italic tracking-tighter uppercase leading-none">Q2 PV Bevindingen les 2: Onvoltooid Verleden Tijd</h1>
                    <p class="text-[10px] uppercase tracking-widest text-blue-200 font-bold mt-1">Passief naar Actief</p>
                </div>
            </div>
            <div class="text-right">
                <span id="counter" class="text-2xl font-black text-yellow-400">1 / 25</span>
            </div>
        </div>

        <div class="w-full bg-gray-200 h-2">
            <div id="progress" class="bg-yellow-500 h-2 transition-all duration-500" style="width: 4%"></div>
        </div>

        <div class="p-8">
            <div id="exercise-box">
                <div class="mb-6">
                    <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Passieve formulering (Fout):</p>
                    <div id="passive-sentence" class="text-lg font-bold text-slate-700 italic border-l-4 border-slate-200 pl-4 py-2 bg-slate-50 uppercase tracking-tight">
                        </div>
                </div>

                <div class="mb-6">
                    <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Uw actieve PV-tekst (Verleden Tijd):</p>
                    <input type="text" id="userInput" 
                           class="w-full p-4 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-900 text-lg"
                           placeholder="Begin met 'Ik'..."
                           autocomplete="off">
                </div>

                <div id="feedback" class="hidden mb-6 p-4 rounded-lg text-sm font-bold border-l-4"></div>

                <button onclick="checkAnswer()" class="w-full bg-[#003366] text-white py-4 rounded-lg font-black uppercase tracking-widest hover:brightness-110 active:scale-95 transition-all">
                    Mutatie Bevestigen
                </button>
            </div>

            <div id="final-screen" class="hidden text-center py-10">
                <h2 class="text-3xl font-black text-blue-900 mb-2 text-center uppercase">Dossier Afgerond</h2>
                <p class="text-slate-600 mb-6">U schrijft nu actief en professioneel.</p>
                <button onclick="location.reload()" class="bg-[#003366] text-white px-8 py-3 rounded-lg font-bold uppercase">Herstart</button>
            </div>
        </div>
    </div>

<script>
    const questions = [
        { p: "De verdachte werd door mij staande gehouden.", c: "Ik hield de verdachte staande" },
        { p: "Door mij werd een bloedspoor op de Dapperstraat gezien.", c: "Ik zag een bloedspoor op de Dapperstraat" },
        { p: "De grijze Volkswagen Golf werd door mij aangetroffen.", c: "Ik trof de grijze volkswagen golf aan" },
        { p: "De pepperspray werd door mij ter hand genomen.", c: "Ik nam de pepperspray ter hand" },
        { p: "Door mij werd de identiteit van de getuige vastgesteld.", c: "Ik stelde de identiteit van de getuige vast" },
        { p: "Een sterke alcohollucht werd door mij waargenomen.", c: "Ik nam een sterke alcohollucht waar" },
        { p: "De handboeien werden door mij bij de man aangelegd.", c: "Ik legde de handboeien bij de man aan" },
        { p: "Door mij werd de PD direct afgezet met lint.", c: "Ik zette de pd direct af met lint" },
        { p: "De portier van de auto werd door mij geopend.", c: "Ik opende de portier van de auto" },
        { p: "Een huls werd door mij op het wegdek gevonden.", c: "Ik vond een huls op het wegdek" },
        { p: "De melding werd door mij via de portofoon bevestigd.", c: "Ik bevestigde de melding via de portofoon" },
        { p: "Door mij werd een beschrijving van de dader genoteerd.", c: "Ik noteerde een beschrijving van de dader" },
        { p: "De snelheid werd door mij geschat op 80 km/u.", c: "Ik schatte de snelheid op 80 km/u" },
        { p: "Een glasfragment werd door mij veiliggesteld.", c: "Ik stelde een glasfragment veilig" },
        { p: "De McDonalds werd door mij doorzocht.", c: "Ik doorzocht de mcdonalds" },
        { p: "Door mij werd de verdachte naar het bureau vervoerd.", c: "Ik vervoerde de verdachte naar het bureau" },
        { p: "Mijn legitimatiebewijs werd door mij getoond.", c: "Ik toonde mijn legitimatiebewijs" },
        { p: "De getuige werd door mij apart genomen.", c: "Ik nam de getuige apart" },
        { p: "Door mij werd assistentie gevraagd.", c: "Ik vroeg assistentie" },
        { p: "De remsporen werden door mij opgemeten.", c: "Ik mat de remsporen op" },
        { p: "Een bekeuring werd door mij uitgereikt.", c: "Ik reikte een bekeuring uit" },
        { p: "De camerabeelden werden door mij bekeken.", c: "Ik bekeek de camerabeelden" },
        { p: "Door mij werd de cautie gegeven.", c: "Ik gaf de cautie" },
        { p: "Het voertuig werd door mij aan de kant gezet.", c: "Ik zette het voertuig aan de kant" },
        { p: "De situatie werd door mij bevroren.", c: "Ik bevroor de situatie" }
    ];

    let current = 0;

    function init() {
        if (current < questions.length) {
            document.getElementById('passive-sentence').innerText = questions[current].p;
            document.getElementById('counter').innerText = (current + 1) + " / 25";
            document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + "%";
            document.getElementById('userInput').value = "";
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('userInput').focus();
        } else {
            document.getElementById('exercise-box').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
        }
    }

    window.checkAnswer = function() {
        let input = document.getElementById('userInput').value.trim().toLowerCase();
        let target = questions[current].c.toLowerCase();
        let feedback = document.getElementById('feedback');

        // Check of de zin met 'ik' begint en de belangrijkste werkwoordsvorm bevat
        if (input.startsWith("ik") && input.includes(target.split(" ")[1])) {
            feedback.innerText = "CORRECT: U schrijft actief.";
            feedback.className = "mb-6 p-4 rounded-lg text-sm font-bold bg-green-100 text-green-800 border-green-500 block";
            current++;
            setTimeout(init, 1000);
        } else {
            feedback.innerText = "FOUT: Begin met 'Ik' en gebruik de verleden tijd.";
            feedback.className = "mb-6 p-4 rounded-lg text-sm font-bold bg-red-100 text-red-800 border-red-500 block";
        }
    }

    document.getElementById('userInput').addEventListener("keypress", e => { if(e.key === 'Enter') checkAnswer(); });
    
    // Start de oefening zodra de pagina geladen is
    window.onload = init;
</script>
</body>
</html>
