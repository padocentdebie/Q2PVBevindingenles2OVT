<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politie Academie | Zintuiglijke Waarnemingen</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --police-blue: #003366; }
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .police-card { border-top: 8px solid var(--police-blue); }
        .logo-img { height: 55px; width: auto; object-fit: contain; }
        textarea { resize: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-2xl w-full bg-white shadow-2xl rounded-xl overflow-hidden police-card">
        <div class="bg-[#003366] p-6 text-white flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="200w.gif" alt="Politie Logo" class="logo-img">
                <div>
                    <h1 class="text-xl font-black italic uppercase leading-none tracking-tighter">PV-Training: Gevorderde Waarneming</h1>
                    <p class="text-[10px] uppercase tracking-widest text-blue-200 font-bold mt-1">Focus: Variabele passieve constructies</p>
                </div>
            </div>
            <div class="text-right">
                <span id="counter" class="text-2xl font-black text-yellow-400">1 / 25</span>
            </div>
        </div>

        <div class="w-full bg-gray-200 h-2">
            <div id="progress" class="bg-yellow-500 h-2 transition-all duration-500" style="width: 4%"></div>
        </div>

        <div class="p-8">
            <div id="exercise-box">
                <div class="mb-6">
                    <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Foutieve passieve constructie:</p>
                    <div id="passive-sentence" class="text-lg font-bold text-slate-700 italic border-l-4 border-slate-200 pl-4 py-2 bg-slate-50 uppercase tracking-tight">
                        Laden van dossier...
                    </div>
                </div>

                <div class="mb-6">
                    <p id="instruction-text" class="text-[10px] font-black uppercase text-slate-400 mb-1">Uw actieve PV-tekst (Ik [werkwoord] dat...):</p>
                    <textarea id="userInput" rows="3"
                           class="w-full p-4 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-900 text-lg transition-all"
                           placeholder="Typ hier de verbeterde zin..."
                           autocomplete="off"></textarea>
                </div>

                <div id="feedback" class="hidden mb-6 p-4 rounded-lg text-sm font-bold border-l-4"></div>

                <button onclick="checkAnswer()" class="w-full bg-[#003366] text-white py-4 rounded-lg font-black uppercase tracking-widest hover:brightness-110 active:scale-95 transition-all">
                    Vastleggen in PV
                </button>
            </div>

            <div id="final-screen" class="hidden text-center py-10">
                <div class="text-5xl mb-4">📜</div>
                <h2 class="text-3xl font-black text-blue-900 mb-2 uppercase">Dossier Voltooid</h2>
                <p class="text-slate-600 mb-6 font-semibold">U bent nu bedreven in het omzetten van diverse passieve waarnemingen naar actieve taal.</p>
                <button onclick="location.reload()" class="bg-[#003366] text-white px-8 py-3 rounded-lg font-bold uppercase tracking-widest">Opnieuw Trainen</button>
            </div>
        </div>
    </div>

<script>
    const questions = [
        { p: "Door mij werd gezien dat de auto met hoge snelheid wegreed.", v: "zag" },
        { p: "Door mij is geroken dat de verdachte naar alcohol stonk.", v: "rook" },
        { p: "Door mij was gehoord dat er binnen in de woning werd geschreeuwd.", v: "hoorde" },
        { p: "Door mij zijn braaksporen op de deurpost waargenomen.", v: "nam" },
        { p: "Door mij was een sterke henneplucht in de gang geroken.", v: "rook" },
        { p: "Door mij wordt gezien dat de man een vuurwapen uit zijn broeksband trekt.", v: "zag" },
        { p: "Door mij zijn kreten om hulp gehoord uit het park.", v: "hoorde" },
        { p: "Door mij was gevoeld dat de loop van het wapen nog warm was.", v: "voelde" },
        { p: "Door mij is gezien dat de ruit van de passagierszijde was verbrijzeld.", v: "zag" },
        { p: "Door mij had een sissend geluid bij de gasfles gehoord moeten worden.", v: "hoorde" },
        { p: "Door mij was waargenomen dat de verdachte zenuwachtig om zich heen keek.", v: "nam" },
        { p: "Door mij is geproefd dat de vloeistof een bijtende werking had.", v: "proefde" },
        { p: "Door mij was gezien dat de motorrijder geen helm droeg.", v: "zag" },
        { p: "Door mij zijn meerdere inslagen in de gevel waargenomen.", v: "nam" },
        { p: "Door mij werd gevoeld dat de pols van het slachtoffer niet meer klopte.", v: "voelde" },
        { p: "Door mij is een doordringende geur van ontbinding geroken.", v: "rook" },
        { p: "Door mij was gehoord dat de achterdeur met een luide knal dichtsloeg.", v: "hoorde" },
        { p: "Door mij zijn bloedspatten op de witte muur gezien.", v: "zag" },
        { p: "Door mij was gevoeld dat het hekwerk onder stroom stond.", v: "voelde" },
        { p: "Door mij is geroken dat de bestuurder een joint had gerookt.", v: "rook" },
        { p: "Door mij werd gezien dat de verdachte probeerde de buit weg te gooien.", v: "zag" },
        { p: "Door mij was waargenomen dat de remlichten van de auto niet werkten.", v: "nam" },
        { p: "Door mij zijn voetstappen op de bovenverdieping gehoord.", v: "hoorde" },
        { p: "Door mij is gezien dat de man een bivakmuts over zijn hoofd trok.", v: "zag" },
        { p: "Door mij was gevoeld dat de tas van de verdachte onnatuurlijk zwaar was.", v: "voelde" }
    ];

    let current = 0;

    function init() {
        if (current < questions.length) {
            const q = questions[current];
            document.getElementById('passive-sentence').innerText = q.p;
            document.getElementById('counter').innerText = (current + 1) + " / 25";
            document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + "%";
            document.getElementById('userInput').value = "";
            document.getElementById('feedback').classList.add('hidden');
            document.getElementById('userInput').focus();
        } else {
            document.getElementById('exercise-box').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
        }
    }

    window.checkAnswer = function() {
        let input = document.getElementById('userInput').value.trim().toLowerCase();
        let q = questions[current];
        let feedback = document.getElementById('feedback');

        const startsWithIk = input.startsWith("ik");
        const containsDat = input.includes(" dat ");
        const containsVerb = input.includes(q.v);
        
        if (startsWithIk && containsDat && containsVerb) {
            feedback.innerText = "UITSTEKEND: Je hebt de passieve vorm correct omgezet naar een actieve waarneming.";
            feedback.className = "mb-6 p-4 rounded-lg text-sm font-bold bg-green-100 text-green-800 border-green-500 block border-l-4";
            feedback.classList.remove('hidden');
            current++;
            setTimeout(init, 1000);
        } else {
            let error = "FOUT: ";
            if (!startsWithIk) error += "Begin altijd met 'Ik'. ";
            if (!containsVerb) error += `Gebruik de juiste actieve verleden tijd (bijv. '${q.v}'). `;
            if (!containsDat) error += "Gebruik 'dat' om de waarneming in te leiden. ";
            
            feedback.innerText = error;
            feedback.className = "mb-6 p-4 rounded-lg text-sm font-bold bg-red-100 text-red-800 border-red-500 block border-l-4";
            feedback.classList.remove('hidden');
        }
    }

    document.getElementById('userInput').addEventListener("keypress", e => { 
        if(e.key === 'Enter') { 
            e.preventDefault(); 
            checkAnswer(); 
        }
    });

    window.onload = init;
</script>
</body>
</html>
