<!DOCTYPE html>
<html lang="nl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Politie Academie | Redenen van Wetenschap</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --police-blue: #003366; }
        body { background: #f0f4f8; font-family: 'Segoe UI', sans-serif; }
        .police-card { border-top: 8px solid var(--police-blue); }
        .logo-img { height: 55px; width: auto; object-fit: contain; }
        textarea { resize: none; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="max-w-2xl w-full bg-white shadow-2xl rounded-xl overflow-hidden police-card">
        <div class="bg-[#003366] p-6 text-white flex justify-between items-center">
            <div class="flex items-center gap-4">
                <img src="200w.gif" alt="Politie Logo" class="logo-img">
                <div>
                    <h1 class="text-xl font-black italic uppercase leading-none tracking-tighter">PV-Training: Redenen van Wetenschap</h1>
                    <p class="text-[10px] uppercase tracking-widest text-blue-200 font-bold mt-1">Locatie: Dapperstraat, Amsterdam</p>
                </div>
            </div>
            <div class="text-right">
                <span id="counter" class="text-2xl font-black text-yellow-400">1 / 25</span>
            </div>
        </div>

        <div class="w-full bg-gray-200 h-2">
            <div id="progress" class="bg-yellow-500 h-2 transition-all duration-500" style="width: 4%"></div>
        </div>

        <div class="p-8">
            <div id="exercise-box">
                <div class="mb-6">
                    <p class="text-[10px] font-black uppercase text-slate-400 mb-1">Passieve formulering (Fout):</p>
                    <div id="passive-sentence" class="text-lg font-bold text-slate-700 italic border-l-4 border-slate-200 pl-4 py-2 bg-slate-50 uppercase tracking-tight">
                        Laden van dossier...
                    </div>
                </div>

                <div class="mb-6">
                    <p id="instruction-text" class="text-[10px] font-black uppercase text-slate-400 mb-1">Uw actieve PV-tekst:</p>
                    <textarea id="userInput" rows="3"
                           class="w-full p-4 border-2 border-slate-200 rounded-lg outline-none focus:border-blue-900 text-lg transition-all"
                           placeholder=""
                           autocomplete="off"></textarea>
                </div>

                <div id="feedback" class="hidden mb-6 p-4 rounded-lg text-sm font-bold border-l-4"></div>

                <button onclick="checkAnswer()" class="w-full bg-[#003366] text-white py-4 rounded-lg font-black uppercase tracking-widest hover:brightness-110 active:scale-95 transition-all">
                    Vastleggen in PV
                </button>
            </div>

            <div id="final-screen" class="hidden text-center py-10">
                <div class="text-5xl mb-4">📜</div>
                <h2 class="text-3xl font-black text-blue-900 mb-2 uppercase">Dossier Voltooid</h2>
                <p class="text-slate-600 mb-6 font-semibold">U hanteert nu consequent de actieve verleden tijd en de juiste redenen van wetenschap.</p>
                <button onclick="location.reload()" class="bg-[#003366] text-white px-8 py-3 rounded-lg font-bold uppercase tracking-widest">Opnieuw Trainen</button>
            </div>
        </div>
    </div>

<script>
    // noDat: true betekent dat het een ambtshandeling is waarbij 'dat' niet logisch is.
    const questions = [
        { p: "Door mij werd een plas rode stroperige vloeistof van ongeveer 20 cm breed en 30 cm lang gezien.", v: "zag", needsDat: true },
        { p: "De verdachte werd door mij staande gehouden.", v: "hield", needsDat: false },
        { p: "De grijze Volkswagen Golf werd door mij aangetroffen.", v: "zag", needsDat: true },
        { p: "De pepperspray werd door mij ter hand genomen.", v: "nam", needsDat: false },
        { p: "Een sterke alcohollucht werd door mij waargenomen.", v: "nam", needsDat: true },
        { p: "De handboeien werden door mij bij de man aangelegd.", v: "legde", needsDat: false },
        { p: "Door mij werd de PD direct afgezet met lint.", v: "zette", needsDat: false },
        { p: "Een huls werd door mij op het wegdek gevonden.", v: "zag", needsDat: true },
        { p: "De melding werd door mij via de portofoon bevestigd.", v: "bevestigde", needsDat: false },
        { p: "De snelheid werd door mij geschat op 80 km/u.", v: "zag", needsDat: true },
        { p: "De McDonalds werd door mij doorzocht.", v: "doorzocht", needsDat: false },
        { p: "Door mij werd de verdachte naar het bureau vervoerd.", v: "vervoerde", needsDat: false },
        { p: "De situatie werd door mij bevroren.", v: "bevroor", needsDat: false },
        { p: "De getuige werd door mij apart genomen.", v: "nam", needsDat: false },
        { p: "De camerabeelden werden door mij uitgekeken.", v: "zag", needsDat: true },
        { p: "De identiteit werd door mij vastgesteld.", v: "stelde", needsDat: false },
        { p: "De voordeur werd door mij geforceerd.", v: "forceerde", needsDat: false },
        { p: "Een mes werd door mij onder de stoel gevonden.", v: "zag", needsDat: true },
        { p: "De cautie werd door mij aan de man gegeven.", v: "gaf", needsDat: false },
        { p: "De remsporen werden door mij opgemeten.", v: "mat", needsDat: false },
        { p: "Een bekeuring werd door mij uitgereikt.", v: "reikte", needsDat: false },
        { p: "De verdachte werd door mij gefouilleerd.", v: "fouilleerde", needsDat: false },
        { p: "De ruit werd door mij verbrijzeld aangetroffen.", v: "zag", needsDat: true },
        { p: "De verklaring werd door mij genoteerd.", v: "noteerde", needsDat: false },
        { p: "De auto werd door mij aan de kant gezet.", v: "zette", needsDat: false }
    ];

    let current = 0;

    function init() {
        if (current < questions.length) {
            const q = questions[current];
            document.getElementById('passive-sentence').innerText = q.p;
            document.getElementById('counter').innerText = (current + 1) + " / 25";
            document.getElementById('progress').style.width = ((current + 1) / questions.length * 100) + "%";
            document.getElementById('userInput').value = "";
            document.getElementById('feedback').classList.add('hidden');
            
            // Pas instructietekst dynamisch aan
            if (q.needsDat) {
                document.getElementById('instruction-text').innerText = "Zintuiglijke waarneming (Gebruik: \"Ik [werkwoord] dat...\"):";
            } else {
                document.getElementById('instruction-text').innerText = "Ambtshandeling (Gebruik: Actieve verleden tijd):";
            }
            
            document.getElementById('userInput').focus();
        } else {
            document.getElementById('exercise-box').classList.add('hidden');
            document.getElementById('final-screen').classList.remove('hidden');
        }
    }

    window.checkAnswer = function() {
        let input = document.getElementById('userInput').value.trim().toLowerCase();
        let q = questions[current];
        let feedback = document.getElementById('feedback');

        const startsWithIk = input.startsWith("ik");
        const containsDat = input.includes(" dat ");
        const containsVerb = input.includes(q.v);
        
        // Validatie: als needsDat true is, MOET 'dat' erin staan. Als false, dan mag het niet of is het niet nodig.
        let validationPass = false;
        if (q.needsDat) {
            validationPass = startsWithIk && containsDat && containsVerb;
        } else {
            validationPass = startsWithIk && containsVerb;
        }

        if (validationPass) {
            feedback.innerText = "UITSTEKEND: Actief en juridisch correct geformuleerd.";
            feedback.className = "mb-6 p-4 rounded-lg text-sm font-bold bg-green-100 text-green-800 border-green-500 block border-l-4";
            feedback.classList.remove('hidden');
            current++;
            setTimeout(init, 1000);
        } else {
            let error = "FOUT: ";
            if (!startsWithIk) error += "Begin de zin met 'Ik'. ";
            if (q.needsDat && !containsDat) error += "Dit is een waarneming; gebruik 'Ik [werkwoord] dat...'. ";
            if (!containsVerb) error += `Gebruik de actieve verleden tijd (bijv. '${q.v}'). `;
            
            feedback.innerText = error;
            feedback.className = "mb-6 p-4 rounded-lg text-sm font-bold bg-red-100 text-red-800 border-red-500 block border-l-4";
            feedback.classList.remove('hidden');
        }
    }

    document.getElementById('userInput').addEventListener("keypress", e => { 
        if(e.key === 'Enter') { 
            e.preventDefault(); 
            checkAnswer(); 
        }
    });

    window.onload = init;
</script>
</body>
</html>
